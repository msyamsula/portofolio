services:
  postgres:
    image: postgres:16-alpine
    command:
      - "postgres"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-32}"
      - "-c"
      - "idle_in_transaction_session_timeout=${POSTGRES_IDLE_IN_TRANSACTION_SESSION_TIMEOUT:-30000}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auto_pr_review}
      POSTGRES_USER: ${POSTGRES_USER:-auto_pr_review}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auto_pr_review}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command:
      - "redis-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxclients"
      - "${REDIS_MAX_CLIENTS:-64}"
      - "--timeout"
      - "${REDIS_IDLE_TIMEOUT_SECONDS:-60}"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:latest
    command: ["sh", "/start-kafka.sh"]
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./scripts/start-kafka.sh:/start-kafka.sh:ro
      - ./kafka/server.properties:/opt/kafka/config/server.properties:ro

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: ${PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-auto_pr_review}:${POSTGRES_PASSWORD:-auto_pr_review}@postgres:5432/${POSTGRES_DB:-auto_pr_review}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-8}
      REDIS_MIN_IDLE_CONNS: ${REDIS_MIN_IDLE_CONNS:-1}
      REDIS_EXEC_TIMEOUT: ${REDIS_EXEC_TIMEOUT:-3s}
      JOB_PERIOD_OPTIONS: ${JOB_PERIOD_OPTIONS:-1s,10m,5h}
      HTTP_REQUEST_TIMEOUT: ${HTTP_REQUEST_TIMEOUT:-5s}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-2s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-5s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-10s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
      POSTGRES_POOL_MAX_CONNS: ${POSTGRES_POOL_MAX_CONNS:-8}
      POSTGRES_POOL_MIN_CONNS: ${POSTGRES_POOL_MIN_CONNS:-1}
      POSTGRES_POOL_MAX_CONN_LIFETIME: ${POSTGRES_POOL_MAX_CONN_LIFETIME:-30m}
      POSTGRES_POOL_MAX_CONN_IDLE_TIME: ${POSTGRES_POOL_MAX_CONN_IDLE_TIME:-5m}
      POSTGRES_EXEC_TIMEOUT: ${POSTGRES_EXEC_TIMEOUT:-3s}
      LLM_PROVIDER: ${LLM_PROVIDER:-claude}
      LLM_API_KEY: ${LLM_API_KEY:-${ANTHROPIC_API_KEY:-}}
      LLM_MODEL: ${LLM_MODEL:-${ANTHROPIC_MODEL:-}}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-1m}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_RETRY_BACKOFF: ${LLM_RETRY_BACKOFF:-500ms}
      LLM_MAX_IDLE_CONNS: ${LLM_MAX_IDLE_CONNS:-10}
      LLM_MAX_IDLE_CONNS_PER_HOST: ${LLM_MAX_IDLE_CONNS_PER_HOST:-10}
      LLM_MAX_CONNS_PER_HOST: ${LLM_MAX_CONNS_PER_HOST:-10}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PR_REVIEW_OUTPUT_DIR: ${PR_REVIEW_OUTPUT_DIR:-reports}
    ports:
      - "${SERVICE_PORT:-8080}:8080"

  job-orchestrator:
    build: .
    command: ["/job-orchestrator"]
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-auto_pr_review}:${POSTGRES_PASSWORD:-auto_pr_review}@postgres:5432/${POSTGRES_DB:-auto_pr_review}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-8}
      REDIS_MIN_IDLE_CONNS: ${REDIS_MIN_IDLE_CONNS:-1}
      REDIS_EXEC_TIMEOUT: ${REDIS_EXEC_TIMEOUT:-3s}
      JOB_ORCHESTRATOR_INTERVAL: ${JOB_ORCHESTRATOR_INTERVAL:-1s}
      JOB_PERIOD_OPTIONS: ${JOB_PERIOD_OPTIONS:-1s,10m,5h}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-pr_review}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-pr_review_dlq}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-auto-pr-review-job-orchestrator}
      KAFKA_MAX_RETRIES: ${KAFKA_MAX_RETRIES:-5}
      KAFKA_RETRY_BACKOFF: ${KAFKA_RETRY_BACKOFF:-100ms}
      KAFKA_MAX_IN_FLIGHT: ${KAFKA_MAX_IN_FLIGHT:-10}
      KAFKA_PUBLISH_TIMEOUT: ${KAFKA_PUBLISH_TIMEOUT:-3s}

  job-consumer:
    build: .
    command: ["/job-consumer"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-auto_pr_review}:${POSTGRES_PASSWORD:-auto_pr_review}@postgres:5432/${POSTGRES_DB:-auto_pr_review}?sslmode=disable
      POSTGRES_POOL_MAX_CONNS: ${POSTGRES_POOL_MAX_CONNS:-8}
      POSTGRES_POOL_MIN_CONNS: ${POSTGRES_POOL_MIN_CONNS:-1}
      POSTGRES_POOL_MAX_CONN_LIFETIME: ${POSTGRES_POOL_MAX_CONN_LIFETIME:-30m}
      POSTGRES_POOL_MAX_CONN_IDLE_TIME: ${POSTGRES_POOL_MAX_CONN_IDLE_TIME:-5m}
      POSTGRES_EXEC_TIMEOUT: ${POSTGRES_EXEC_TIMEOUT:-3s}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-pr_review}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-pr_review_dlq}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-auto-pr-review-job-consumer}
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:-auto_pr_review}
      KAFKA_CONSUMER_MAX_RETRIES: ${KAFKA_CONSUMER_MAX_RETRIES:-5}
      KAFKA_CONSUMER_RETRY_BACKOFF: ${KAFKA_CONSUMER_RETRY_BACKOFF:-100ms}
      KAFKA_CONSUMER_ATTEMPT_TIMEOUT: ${KAFKA_CONSUMER_ATTEMPT_TIMEOUT:-5s}
      KAFKA_CONSUMER_MAX_IN_FLIGHT: ${KAFKA_CONSUMER_MAX_IN_FLIGHT:-15}
      LLM_PROVIDER: ${LLM_PROVIDER:-claude}
      LLM_API_KEY: ${LLM_API_KEY:-${ANTHROPIC_API_KEY:-}}
      LLM_MODEL: ${LLM_MODEL:-${ANTHROPIC_MODEL:-}}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-1m}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_RETRY_BACKOFF: ${LLM_RETRY_BACKOFF:-500ms}
      LLM_MAX_IDLE_CONNS: ${LLM_MAX_IDLE_CONNS:-10}
      LLM_MAX_IDLE_CONNS_PER_HOST: ${LLM_MAX_IDLE_CONNS_PER_HOST:-10}
      LLM_MAX_CONNS_PER_HOST: ${LLM_MAX_CONNS_PER_HOST:-10}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PR_REVIEW_OUTPUT_DIR: ${PR_REVIEW_OUTPUT_DIR:-reports}

volumes:
  postgres-data:
