<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auto PR Review Links</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="workspace" aria-labelledby="page-title">
        <div class="mast">
          <div>
            <p class="eyebrow">GitHub registry</p>
            <h1 id="page-title">Auto PR Review Links</h1>
          </div>
          <div class="mark" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <form id="link-form" class="entry" autocomplete="off">
          <label for="github-url">GitHub URL</label>
          <div class="entry-row">
            <input
              id="github-url"
              name="url"
              type="url"
              inputmode="url"
              placeholder="https://github.com/owner/repo"
              required
            >
            <button type="submit" id="submit-button">Add</button>
          </div>
          <output id="message" class="message" for="github-url"></output>
        </form>

        <section class="links-panel" aria-labelledby="links-title">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Saved</p>
              <h2 id="links-title">Registered links</h2>
            </div>
            <button type="button" id="refresh-button" class="secondary">Refresh</button>
          </div>
          <ul id="links-list" class="links-list" aria-live="polite"></ul>
          <div id="empty-state" class="empty-state" hidden>
            <div class="empty-asset" aria-hidden="true">
              <span></span>
              <span></span>
            </div>
            <p>No links registered yet.</p>
          </div>
        </section>
      </section>
    </main>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
